name: Build

# ============================================================
# 自动构建：推送代码 / 提 PR / 手动触发时自动编译
# ============================================================
# 产物：
#   nfhandshake-<版本>.jar —— 主 mod（ViaNeoForge 握手适配）
#
# 注：mcpmod（游戏内调试命令桥）已拆分到独立仓库：
#   https://github.com/yingfing/vianeoforge-mcpmod
#
# 触发条件：
#   push              —— 任意分支推送
#   pull_request      —— 向主分支提 PR
#   workflow_dispatch —— 手动触发（Actions 页面点按钮）
# ============================================================

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'handover/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 同一分支的重复运行自动取消，节省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ---------- 1. 取代码 ----------
      - name: 检出代码
        uses: actions/checkout@v5

      # ---------- 2. 装 JDK ----------
      # Loom 1.18.2 要求 JVM >= 25，因此必须装 25。
      - name: 安装 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # ---------- 3. 装 Gradle ----------
      # 用 gradle/actions 而不是 gradlew：
      # 本项目没有提交 wrapper，由 action 自动提供指定版本。
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ---------- 4. 构建 ----------
      - name: 构建
        run: gradle build -x test --no-daemon --stacktrace

      # ---------- 5. 收集产物 ----------
      - name: 收集构建产物
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/ 2>/dev/null || true
          # 去掉 sources jar（用户不需要）
          rm -f dist/*-sources.jar
          echo "=== 产物清单 ==="
          ls -lh dist/

      # ---------- 6. 上传产物 ----------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: nfhandshake-jar
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 90
